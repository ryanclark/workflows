name: rust-ci

on:
  workflow_call:
    inputs:
      runners:
        description: JSON array of runner labels for the lint/test matrix.
        type: string
        default: '["macos-latest", "ubuntu-latest"]'
      toolchain:
        description: Rust toolchain to install.
        type: string
        default: stable
      codesigned-clippy:
        description: Also run clippy with the `codesigned` feature.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install ${{ inputs.toolchain }} --profile minimal --component clippy,rustfmt

      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --tests -- -D warnings

      - name: Lint (codesigned)
        if: ${{ inputs.codesigned-clippy }}
        run: cargo clippy --locked --tests --features codesigned -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Save cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
