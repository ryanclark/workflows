name: rust-release-plz

on:
  workflow_call:
    inputs:
      app-id:
        description: GitHub App ID used to mint the release-plz token.
        type: string
        required: true
      release-plz-version:
        type: string
        default: "0.3.157"
      release-plz-sha256:
        description: SHA-256 of the release-plz aarch64-apple-darwin tarball.
        type: string
        default: "0006b843fd25e11b4aec073a6feb5e9b1be27702863504bef1432c39b795b52c"
    secrets:
      APP_KEY:
        description: PEM private key for the GitHub App.
        required: true

jobs:
  release-plz:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_KEY }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/release-plz-target
          key: cargo-release-plz-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-plz-${{ runner.os }}-

      - name: Install release-plz
        env:
          RELEASE_PLZ_VERSION: ${{ inputs.release-plz-version }}
          RELEASE_PLZ_SHA256: ${{ inputs.release-plz-sha256 }}
        run: |
          curl -sSLf "https://github.com/release-plz/release-plz/releases/download/release-plz-v${RELEASE_PLZ_VERSION}/release-plz-aarch64-apple-darwin.tar.gz" -o release-plz.tar.gz
          echo "${RELEASE_PLZ_SHA256}  release-plz.tar.gz" | shasum -a 256 --check
          tar xzf release-plz.tar.gz
          mv release-plz /usr/local/bin/
          rm release-plz.tar.gz

      - name: Create or update release PR
        env:
          CARGO_TARGET_DIR: /tmp/release-plz-target
        run: release-plz release-pr --git-token "${{ steps.app-token.outputs.token }}"

      - name: Tag and release if PR was merged
        env:
          CARGO_TARGET_DIR: /tmp/release-plz-target
        run: release-plz release --git-token "${{ steps.app-token.outputs.token }}"
